[project]
name = "appium-agentic-self-healing-tests"
version = "0.1.0"
description = "Agent-assisted self-healing test automation for Android using Appium"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
